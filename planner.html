<title>Pine Lake Yard Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed survey-scale map you build on; drawing-set "sheets" float over it: title block + palette (left), tool rail, inspector (right), HUD (top), season bar (bottom). */
:root{
  --paper:#f2efe4;--paper2:#e9e5d7;--ink:#1b2228;--mute:#5d666d;--line:#1b2228;--grid:rgba(27,34,40,.07);
  --accent:#c2402a;--blue:#1f5f9e;--on:#1b2228;--onink:#f2efe4;--shadow:0 6px 24px rgba(10,14,18,.28);
  --ok:#2e7d4f;--warn:#b7791f;--err:#c2402a;
  --map-bg:#e6e2d4;--map-grid:rgba(27,34,40,.08);--lawn:#5e8a3f;--lawn2:#6f9a48;--road:#7d7c78;--conc:#c9c6bd;--roof:#3b3f45;--water:#7fa3b5;--buffer:#7d8550;--septic:#6b9645;--cast:rgba(20,28,16,.28);
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141a1f;--paper2:#1b232a;--ink:#e7e2d4;--mute:#97a0a6;--line:#56616a;--grid:rgba(231,226,212,.06);--accent:#ff7b5c;--blue:#6db0ee;--on:#e7e2d4;--onink:#141a1f;--shadow:0 6px 24px rgba(0,0,0,.55);
  --ok:#5cc489;--warn:#e7b04b;--err:#ff7b5c;
  --map-bg:#20272c;--map-grid:rgba(231,226,212,.06);--lawn:#3f6630;--lawn2:#4b7437;--road:#4b4c4e;--conc:#8f8c86;--roof:#23262a;--water:#3d5a68;--buffer:#545c3a;--septic:#4a6c33;--cast:rgba(0,0,0,.38);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a1f;--paper2:#1b232a;--ink:#e7e2d4;--mute:#97a0a6;--line:#56616a;--grid:rgba(231,226,212,.06);--accent:#ff7b5c;--blue:#6db0ee;--on:#e7e2d4;--onink:#141a1f;--shadow:0 6px 24px rgba(0,0,0,.55);
  --ok:#5cc489;--warn:#e7b04b;--err:#ff7b5c;
  --map-bg:#20272c;--map-grid:rgba(231,226,212,.06);--lawn:#3f6630;--lawn2:#4b7437;--road:#4b4c4e;--conc:#8f8c86;--roof:#23262a;--water:#3d5a68;--buffer:#545c3a;--septic:#4a6c33;--cast:rgba(0,0,0,.38);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--map-bg);color:var(--ink);font:500 12px/1.4 var(--mono);-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--paper);border:1px solid var(--line);padding:6px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;min-height:32px}
button:hover{background:var(--paper2)}
button[aria-pressed="true"]{background:var(--on);color:var(--onink)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--line);background:var(--paper);padding:5px 7px;min-height:32px;min-width:0;width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
h2{font:700 11.5px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:4px 0 8px;display:flex;align-items:center;gap:6px}
h2:before{content:"";width:7px;height:7px;background:var(--accent);display:inline-block;flex:none}
.k{font-size:8.5px;letter-spacing:.12em;color:var(--mute);display:block;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}

/* left panel */
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:330px;display:flex;flex-direction:column;z-index:6;transition:transform .25s ease}
.tb{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1.5px solid var(--line)}
.tb>div{padding:5px 8px;border-right:1px solid var(--line);min-width:0}
.tb>div:nth-child(4){border-right:0}
.tb .wide{grid-column:1/4;border-right:0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tb h1{font:700 23px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.tb h1 small{display:block;font:600 12.5px/1.3 var(--display);letter-spacing:.14em;color:var(--accent);margin-top:3px}
.tb .v{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-variant-numeric:tabular-nums}
.planbar{display:grid;grid-template-columns:1fr auto auto;gap:4px;padding:6px;border-bottom:1.5px solid var(--line)}
.planbar select{font:700 13px var(--display);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;border-right:1px solid var(--line);font-size:9.5px;padding:6px 1px;letter-spacing:.05em}
.tabs button:last-child{border-right:0}
#drawer{overflow-y:auto;flex:1;overscroll-behavior:contain;padding:10px;scrollbar-width:thin;min-height:0}
.grp{margin-bottom:12px}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);cursor:pointer;width:100%;text-align:left;background:none;text-transform:none;letter-spacing:0;font-size:11.5px;min-height:0}
.row:hover{background:var(--paper2)}
.row[aria-pressed="true"]{background:var(--paper2);outline:2px solid var(--accent);outline-offset:-2px;color:var(--ink)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 40%,transparent);flex:none}
.sw.sq{border-radius:2px}
.nm{min-width:0}
.nm b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;color:var(--mute);font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;margin-top:4px}
.cal span{height:5px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.cal span.now{outline:1px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;background:var(--paper)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.err{border-color:var(--err);color:var(--err)}
.msg{display:grid;grid-template-columns:10px 1fr;gap:7px;align-items:start;padding:4px 0;font-size:11.5px}
.msg:before{content:"";width:8px;height:8px;margin-top:4px;background:var(--ok)}
.msg.warn:before{background:var(--warn)}.msg.err:before,.msg.block:before{background:var(--err)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-bottom:8px}
.seg button+button{border-left:0}
.swg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.swg button{display:grid;grid-template-rows:38px auto;padding:0;text-transform:none;letter-spacing:0;font-size:10px;line-height:1.2;text-align:left;min-height:0;overflow:hidden}
.swg button canvas{width:100%;height:38px;display:block;border-bottom:1px solid var(--line)}
.swg button span{padding:3px 5px 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swg button[aria-pressed="true"]{background:var(--paper);outline:2.5px solid var(--accent);outline-offset:-2px;color:var(--ink)}
.field{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.field label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.field .pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.field .pair3{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.tog{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);cursor:pointer;font-size:11.5px}
.tog input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.tog .sw{margin-left:auto}
.search{margin-bottom:8px}
.filt{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.filt button{font-size:9.5px;padding:4px 7px;min-height:26px}
.task{padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);font-size:11.5px}
.foot{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-top:1.5px solid var(--line)}
.save{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap;align-self:center;text-align:center;overflow:hidden;text-overflow:ellipsis}
.save.on{color:var(--ok)}
.bud{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);font-size:11px}
.bud .q{color:var(--mute);font-size:10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bud input{width:74px;min-height:26px;padding:2px 4px;text-align:right;font-size:11px}
.bud b{font-variant-numeric:tabular-nums;text-align:right}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1.5px solid var(--line);margin-top:6px}
.tot b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.shots button{padding:0;border:1px solid var(--line);min-height:0;aspect-ratio:16/10;overflow:hidden;background:var(--paper2)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.hero{padding:0;border:1px solid var(--line);min-height:0;width:100%;display:block;background:var(--paper2)}
.hero img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}

/* tool rail */
#tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(max(12px,env(safe-area-inset-left,0px)) + 342px);z-index:6;display:flex;flex-direction:column;padding:0}
#tools button{width:58px;height:54px;border:0;border-bottom:1px solid var(--line);display:grid;place-items:center;gap:1px;padding:4px 2px;font-size:8.5px;letter-spacing:.06em;position:relative}
#tools button:last-child{border-bottom:0}
#tools svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools kbd{position:absolute;top:2px;right:4px;font:600 8px var(--mono);opacity:.55}

/* HUD */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(max(12px,env(safe-area-inset-left,0px)) + 414px);right:calc(max(12px,env(safe-area-inset-right,0px)) + 352px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#hud>*{pointer-events:auto;max-width:100%}
#stats{display:flex;align-items:stretch}
#stats>div{padding:4px 10px;border-right:1px solid var(--line);min-width:0}
#stats>div:last-child{border-right:0}
#stats b{font:700 16px/1.1 var(--display);font-variant-numeric:tabular-nums;display:block;white-space:nowrap}
#hint{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;font-size:11px;flex-wrap:wrap;justify-content:center}
#hint .acts{display:flex;gap:4px}
#hint .acts:empty{display:none}
#hint .acts button{min-height:28px;padding:3px 8px}
#where{padding:3px 9px;font-size:10.5px;color:var(--mute);background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid color-mix(in srgb,var(--line) 50%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* inspector */
#insp{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 220px);overflow-y:auto;z-index:7;overscroll-behavior:contain}
#insp header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px 12px 8px;border-bottom:1.5px solid var(--line)}
#insp h3{font:700 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
#insp h3 small{display:block;font:600 12.5px/1.2 var(--display);letter-spacing:.08em;color:var(--accent);margin-top:2px;text-transform:none}
#insp .body{padding:10px 12px;display:grid;gap:10px}
#insp .facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
#insp .facts>div{padding:5px 7px;border-right:1px solid var(--line);min-width:0}
#insp .facts>div:last-child{border-right:0}
#insp .facts b{font:700 15px/1.1 var(--display);font-variant-numeric:tabular-nums;display:block}
#insp p{font-size:11.5px;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1}
.x{min-height:28px;padding:2px 9px;font-size:13px}
.mix{display:grid;grid-template-columns:14px 1fr 64px 30px;gap:6px;align-items:center;padding:3px 0}
.mix select,.mix input{min-height:28px;padding:2px 4px;font-size:11px}

/* bottom */
#timebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;width:min(520px,calc(100% - 32px));display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:7px 10px}
.months{display:grid;grid-template-columns:repeat(12,1fr);grid-column:1/3}
.months button{border:0;border-right:1px solid color-mix(in srgb,var(--line) 40%,transparent);padding:4px 0;min-height:26px;font-size:9.5px;letter-spacing:.03em}
.months button:last-child{border-right:0}
.yearv{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
#mini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:190px;height:178px;z-index:5;cursor:pointer}
#mini canvas{width:100%;height:100%;display:block}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;padding:7px 12px;font-size:11.5px;max-width:min(480px,calc(100% - 32px));pointer-events:none}
#toast.err{border-color:var(--err)}#toast.warn{border-color:var(--warn)}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:13;width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;padding:16px 18px;display:grid;gap:10px}
.dlg h3{font:700 24px/1 var(--display);text-transform:uppercase}
.dlg ul{list-style:none;display:grid;gap:6px;font-size:11.5px}
.dlg kbd{font:600 10.5px var(--mono);border:1px solid var(--line);padding:0 5px;background:var(--paper2)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:12}
#shot{position:fixed;inset:0;z-index:14;background:rgba(10,14,18,.86);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#shot figure{max-width:min(1400px,100%);display:grid;gap:8px}
#shot img{max-width:100%;max-height:calc(100vh - 140px);display:block;margin:0 auto;border:1.5px solid var(--line)}
#shot figcaption{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;flex-wrap:wrap}
#shot figcaption span{font:600 13px/1.3 var(--display);letter-spacing:.06em;text-transform:uppercase;min-width:0}
#topbar,#strip,#joy,#walkacts,#pscrim{display:none}

@media (max-width:1180px) and (min-width:821px){#hud{right:calc(max(12px,env(safe-area-inset-right,0px)) + 12px)}#stats{display:none}#timebar{left:auto;right:214px;transform:none;width:min(420px,calc(100% - 660px))}}

/* phone */
@media (max-width:820px){
  #panel{top:0;left:0;bottom:0;width:min(360px,92vw);transform:translateX(-105%);border-left:0;border-top:0;border-bottom:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);z-index:11}
  body.open #panel{transform:none}
  body.open #pscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
  #topbar{display:grid;grid-template-columns:auto 1fr auto auto;position:fixed;top:0;left:0;right:0;z-index:6;gap:6px;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));border-width:0 0 1.5px}
  #topbar select{font:700 13px var(--display);text-transform:uppercase}
  #topbar button{min-width:40px}
  #tools{top:auto;left:0;right:0;bottom:0;flex-direction:row;border-width:1.5px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #tools button{flex:1;width:auto;min-width:0;height:52px;border-bottom:0;border-right:1px solid var(--line)}
  #tools button:last-child{border-right:0}
  #tools kbd{display:none}
  #strip{display:flex;position:fixed;left:0;right:0;bottom:calc(53px + env(safe-area-inset-bottom,0px));z-index:6;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-width:1.5px 0 0;box-shadow:none}
  #strip button{flex:none;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:11px;padding:4px 8px;min-height:36px}
  #strip canvas{width:24px;height:24px;border:1px solid var(--line)}
  #hud{top:calc(52px + env(safe-area-inset-top,0px));left:8px;right:8px}
  #stats{display:none}
  #insp{left:0;right:0;top:auto;bottom:calc(53px + env(safe-area-inset-bottom,0px));width:auto;max-height:56%;border-left:0;border-right:0;border-bottom:0;z-index:8}
  #timebar,#mini{display:none}
  #toast{bottom:calc(116px + env(safe-area-inset-bottom,0px))}
  body.walk #joy{display:block;position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;z-index:5;touch-action:none;border:1.5px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent)}
  #joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--on);opacity:.85}
  body.walk #walkacts{display:grid;gap:8px;position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5}
  #walkacts button{width:84px;min-height:42px;font-size:10px;box-shadow:var(--shadow)}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

<canvas id="map" aria-label="Plan view of the lot. Build with the tools; walk the gardener with WASD or the joystick."></canvas>

<div id="topbar" class="sheet">
  <button id="menuBtn" aria-label="Open palette and plan panel">☰</button>
  <select id="planSel2" aria-label="Yard plan"></select>
  <button id="undo2" aria-label="Undo">↶</button><button id="redo2" aria-label="Redo">↷</button>
</div>
<div id="pscrim"></div>

<aside id="panel" class="sheet" aria-label="Builder panel">
  <div class="tb">
    <div class="wide"><h1>7305 Pine Lake Blvd<small>YARD BUILDER · PLANT &amp; ZONE MAP</small></h1><button class="x" id="helpBtn" aria-label="How it works">?</button></div>
    <div><span class="k">Plants · trees</span><span class="v" id="tbPlants">—</span></div>
    <div><span class="k">Est. materials</span><span class="v" id="tbCost">—</span></div>
    <div><span class="k">Issues</span><span class="v" id="tbIssues">—</span></div>
  </div>

/* ================= plans ================= */

  $('mX').onclick = closeDlg; $('rnGo').onclick = () => { const n = $('rnName').value.trim(); if (n) { p.name = n; p.edited = true; renderStats(); scheduleSave(p.id); } closeDlg(); };
  $('dupGo').onclick = () => { const id = newPlanId(), q = { id, name: p.name + ' (copy)', base: p.base, builtin: false, ents: p.ents.map(strip), prices: { ...p.prices }, edited: true }; ST.plans[id] = q; ST.order.push(id); closeDlg(); setPlan(id); scheduleSave(id); };

function copyPlan() {
  const lines = [`${plan().name} · 7305 Pine Lake Blvd · lot grid in feet (origin SW corner, +x east, +y north) · est. materials ${money(budget().total)}`, 'ID\tType\tWhat\tWhere\tSize\tChecks'];

    const size = e.t === 'bed' ? Math.round(geo(e).area) + ' sf' : e.t === 'path' ? Math.round(geo(e).len) + ' ft × ' + e.w + ' ft' : e.t === 'st' ? `${e.w}×${e.h} ft${e.rot ? ' @' + e.rot + '°' : ''}` : e.t === 'row' ? rowCount(e) + ' plants, ' + Math.round(geo(e).len) + ' ft' : '';

/* ================= saving ================= */
let DB = null, saveTimer = null, saving = Promise.resolve(); const pendingSave = new Set();
function setSaveState(t, on, title) { $('saveState').textContent = t; $('saveState').title = title || t; $('saveState').classList.toggle('on', !!on); }
function serial(p) { return { id: p.id, name: p.name, base: p.base, builtin: !!p.builtin, ents: p.ents.map(strip), prices: p.prices || {}, updated: new Date().toISOString() }; }
function scheduleSave(id) { pendingSave.add(id || ST.cur); setSaveState('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(() => { const ids = [...pendingSave]; pendingSave.clear(); ids.forEach(saveNow); }, 700); }
function saveNow(id) { const p = ST.plans[id]; if (!p) return; const data = serial(p);
  try { const all = JSON.parse(localStorage.getItem('plb-plans') || '{}'); all[id] = data; localStorage.setItem('plb-plans', JSON.stringify(all)); } catch (e) {}
  if (DB) saving = saving.then(() => DB.doc('plans/' + id).set(data)).then(() => setSaveState('Saved', true, 'Saved to this page’s shared store'), () => setSaveState('Saved', true, 'Saved on this device')); else setSaveState('Saved', true, 'Saved on this device'); }
function deleteSaved(id) { try { const all = JSON.parse(localStorage.getItem('plb-plans') || '{}'); delete all[id]; localStorage.setItem('plb-plans', JSON.stringify(all)); } catch (e) {} if (DB) saving = saving.then(() => DB.doc('plans/' + id).delete()).catch(() => {}); }
function valid(e) { if (!e || !e.id || !e.t) return false; if (e.t === 'plant') return !!SP[e.sp] && isFinite(e.x) && isFinite(e.y); if (e.t === 'row') return !!SP[e.sp] && [e.x1, e.y1, e.x2, e.y2].every(isFinite); if (e.t === 'bed') return !!BM[e.mat] && Array.isArray(e.pts) && e.pts.length >= 3; if (e.t === 'path') return !!PM[e.mat] && Array.isArray(e.pts) && e.pts.length >= 2; if (e.t === 'st') return !!SD[e.k] && isFinite(e.x) && isFinite(e.w); return false; }
function applySaved(d) { if (!d || !d.id || !Array.isArray(d.ents)) return; const p = { id: d.id, name: d.name || 'My yard', base: BUILTIN[d.base] ? d.base : 'A', builtin: !!BUILTIN[d.id], ents: d.ents.filter(valid), prices: d.prices || {}, edited: true }; const seen = new Set(); for (const e of p.ents) { if (e.t === 'bed' && !Array.isArray(e.comp)) e.comp = []; let id = e.id, n = 2; while (seen.has(id)) id = e.id + '-' + n++; e.id = id; seen.add(id); } ST.plans[d.id] = p; if (!ST.order.includes(d.id)) ST.order.push(d.id); }
async function loadSaved() {
  try { const all = JSON.parse(localStorage.getItem('plb-plans') || '{}'); for (const d of Object.values(all)) applySaved(d); } catch (e) {}
  try { const pr = JSON.parse(localStorage.getItem('plb-prefs') || 'null'); if (pr) { Object.assign(ST.layers, pr.layers || {}); Object.assign(ST.snap, pr.snap || {}); if (pr.cur && ST.plans[pr.cur]) ST.cur = pr.cur; } } catch (e) {}
  setSaveState(Object.values(ST.plans).some(p => p.edited) ? 'Saved' : 'Not edited', false, 'Saved on this device'); editVer++; renderUI(); renderHint();
  if (!window.claude || !window.claude.use) return;
  try { const db = await window.claude.use('db'); if (!db) return; DB = db; const snap = await db.collection('plans').get(); for (const d of snap.docs) applySaved(d.data()); setSaveState('Synced', true, 'Synced with this page’s shared store'); editVer++; renderUI(); } catch (e) {}
}
function savePrefs() { try { localStorage.setItem('plb-prefs', JSON.stringify({ layers: ST.layers, snap: ST.snap, cur: ST.cur })); } catch (e) {} }

function buildMonths(root) { root.innerHTML = MON.map((m, i) => `<button data-m="${i + 1}" aria-pressed="${i + 1 === ST.month}">${m}</button>`).join(''); for (const b of root.children) b.onclick = () => setMonth(+b.dataset.m); }

function setYear(y) { ST.year = y; $('year').value = y; $('yearv').textContent = (2027 + y) + (y ? ' · +' + y + ' YR' : ' · PLANTING'); if ($('year2v')) $('year2v').textContent = 2027 + y; }

for (const b of $('tabs').children) b.onclick = () => { ST.tab = b.dataset.tab; renderDrawer(); };
$('menuBtn').onclick = () => document.body.classList.toggle('open'); $('pscrim').onclick = () => document.body.classList.remove('open');
$('actInspect').onclick = inspectNear; $('actCenter').onclick = () => { ST.follow = true; };
function helpHTML() { const tap = small ? 'tap' : 'click'; return `<h3>Build your yard</h3><ul>
  <li><b>Plant</b> <kbd>P</kbd>: pick a plant, ${tap} to plant it. “Drag a row” lays out an evenly spaced row; raspberries and blackberries always plant as hedgerows.</li>
  <li><b>Beds</b> <kbd>B</kbd>: pick a material (mulch, pine straw, gravel, meadow, moss…), then ${tap} corners, or drag out a rectangle or oval. Add a planting mix in the inspector.</li>
  <li><b>Paths</b> <kbd>L</kbd>: stepping stones, flagstone, pavers, gravel, boardwalk, mown paths, plus fences and stone walls. Points snap to other path ends, bed corners and edges${small ? '' : '; Shift locks 15° angles'}.</li>
  <li><b>Build</b> <kbd>U</kbd>: kitchen gardens, raised beds, greenhouses, sheds, patios, fire pits, benches and more.</li>
  <li><b>Select</b> <kbd>V</kbd>: drag to move. Squares reshape, + adds a corner, the round handle rotates. ${small ? '' : 'Shift-drag box-selects; <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicates; <kbd>R</kbd> rotates; <kbd>Del</kbd> removes. '}Undo is always there.</li>
  <li><b>Walk</b> <kbd>G</kbd>: walk the gardener around with ${small ? 'the joystick' : 'WASD'} and inspect what’s nearby.</li>
  <li>Septic field and reserve, well, house, easements and the pond buffer are checked live. The budget adds up materials as you go, and everything saves on its own.</li></ul><div class="acts"><button id="hX" aria-pressed="true">Start building</button></div>`; }
$('helpBtn').onclick = () => { openDlg(helpHTML()); $('hX').onclick = () => { closeDlg(); try { localStorage.setItem('plb-help', '1'); } catch (e) {} }; };
{ const j = $('joy'), knob = j.querySelector('i'); let id = null; const mv = ev => { const r = j.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = (ev.clientX - cx) / (r.width / 2), dy = (ev.clientY - cy) / (r.height / 2); const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } joyV = [dx, -dy]; knob.style.transform = `translate(${dx * 34}px,${dy * 34}px)`; };
  j.addEventListener('pointerdown', ev => { id = ev.pointerId; try { j.setPointerCapture(id); } catch (e) {} mv(ev); }); j.addEventListener('pointermove', ev => { if (ev.pointerId === id) mv(ev); }); const up = ev => { if (ev.pointerId !== id) return; id = null; joyV = [0, 0]; knob.style.transform = ''; }; j.addEventListener('pointerup', up); j.addEventListener('pointercancel', up); }

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { contour = null; groundKey = ''; if (ground) buildGround(); });
